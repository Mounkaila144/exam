services:
  postgres:
    image: postgres:16-alpine
    container_name: examguard-postgres
    environment:
      POSTGRES_DB: examguard
      POSTGRES_USER: examguard
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - examguard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examguard"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: examguard-redis
    ports:
      - "6379:6379"
    volumes:
      - examguard-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: examguard-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: examguard
      MINIO_ROOT_PASSWORD: examguard-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - examguard-minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 examguard examguard-secret;
      mc mb -p local/examguard || true;
      mc anonymous set download local/examguard || true;
      exit 0;
      "

volumes:
  examguard-postgres:
  examguard-redis:
  examguard-minio:
